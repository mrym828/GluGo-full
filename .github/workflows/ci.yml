name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      DEBUG: '1'
      SECRET_KEY: ci-test-key
      DB_NAME: glugo
      DB_USER: glugo
      DB_PASSWORD: glugo_dev
      DB_HOST: localhost
      DB_PORT: 5432
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: glugo
          POSTGRES_USER: glugo
          POSTGRES_PASSWORD: glugo_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U glugo -d glugo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: Backend/requirements.txt

      - run: pip install -r requirements.txt

      - run: python manage.py migrate --noinput

      - run: python manage.py test core

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glugo
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - run: flutter analyze
